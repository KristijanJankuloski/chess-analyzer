[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]
# `cargo test` at the root covers the library and the CLI; the desktop shell needs the
# Tauri toolchain (and WebView libraries on Linux), so it is built and tested explicitly.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.88"
